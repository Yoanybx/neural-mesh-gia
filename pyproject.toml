[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-mesh-gia"
version = "0.18.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3", "networkx>=3,<4"]

[project.optional-dependencies]
distributed = ["ray>=2.58,<3"]
ml = ["torch>=2.14,<3"]
telemetry = ["opentelemetry-api>=1.37", "opentelemetry-sdk>=1.37"]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.13"]

[project.scripts]
mesh = "neural_mesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["snapshots", "dist", ".venv", ".git", "build"]
markers = [
    "packaging_single_node_bundle: CP-0024 single-node bundle packaging",
    "packaging_rc_cycle21: CP-0025 clean-node smoke / manifest repro / RC freeze",
    "packaging_rc_cycle22: CP-0026 rc install / rollback / release checklist",
    "packaging_rc_cycle23: CP-0027 rc soak / final audit / post-RC watch",
    "packaging_rc_cycle24: CP-0028 release signoff / tag archive / post-release monitor",
    "packaging_rc_cycle25: CP-0029 post-release monitor continue / 0.17 planning / debt gate review",
    "packaging_rc_cycle26: CP-0030 0.17 scope freeze / schema gate resolution / bootstrap",
    "packaging_n2: CP-0031 N=2 multi-node packaging design / manifest parity / install rollback",
    "packaging_n2_cycle28: CP-0032 N2 soak / final audit / RC freeze",
    "fabric_ops_cycle29: CP-0033 fabric ops UX status/diagnose/reconnect",
    "obs_peers_cycle30: CP-0034 richer OBS peers injection / RO probe",
    "signoff_cycle32: CP-0036 0.17 theme-set signoff closeout",
    "signoff_cycle42: CP-0046 0.18 H1..H8 theme-set signoff closeout",
    "quickstart_cycle31: CP-0035 external quickstart 0.16.3 + 0.17 stub",
    "bootstrap_cycle33: CP-0037 0.18 bootstrap / GOV.7 entry waiver",
    "bootstrap_plan_cycle43: CP-0047 0.19 bootstrap plan / L_judge MIX + durable goals design",
    "scope_freeze_cycle44: CP-0048 0.19 scope freeze themes A-D",
    "shell_spike_cycle45: CP-0049 agent-shell adapter spike plan",
    "m1_design_cycle46: CP-0050 M1 consensus choice design + M2/M3 pointers",
    "schema_stubs_cycle47: CP-0051 L_judge/goal/continuity/shell schema stubs",
    "l_judge_integration_cycle48: CP-0052 L_judge MIX integration design + mock",
    "shell_spike_execution_cycle49: CP-0053 agent-shell spike execution (mock pipeline)",
    "m1_scorecard_maturation_cycle50: CP-0054 M1 scorecard maturation (provisional scores + NO_CONSENSUS_YET)",
    "design_set_signoff_cycle51: CP-0055 0.19 design-set signoff A-D closeout",
    "l1_residue_closeout_cycle52: CP-0056 L1 residue closeout R1/R2/R3",
    "l_judge_live_adapter_design_cycle53: CP-0057 L_judge live-adapter design (no live API)",
    "l_judge_live_adapter_safety_cycle54: CP-0058 L_judge live-adapter safety case (no live API)",
    "m2_membership_rejoin_cycle55: CP-0059 M2 membership+rejoin design (mock SM; no N>2/Raft)",
    "m3_wan_model_cycle56: CP-0060 M3 WAN model design (bands/HLC/partition classes; no N>2/Raft)",
    "identity_cycle34: CP-0038 0.18_H1 identity + attestation + trust tiers",
    "recovery_cycle35: CP-0039 0.18_H2 recovery + rebuild / ABORT snapshot restore",
    "fence_cycle36: CP-0040 0.18_H3 dual-primary fence / ABORT demote+re-elect",
    "obs_telemetry_cycle37: CP-0041 0.18_H4 OBS telemetry contract / ABORT block CP mint",
    "packaging_dist_cycle38: CP-0042 0.18_H5 packaging distribution / ABORT pin prior",
    "minority_write_cycle39: CP-0043 0.18_H6 minority_write @N2 / ABORT halt writes",
    "clock_skew_cycle40: CP-0044 0.18_H7 clock_skew @N2 / ABORT refuse join",
    "manifest_parity_cycle41: CP-0045 0.18_H8 manifest_parity @N2 / ABORT reject build",
]

